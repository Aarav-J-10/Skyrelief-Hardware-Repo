name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Gate the release on the same checks as CI
        run: |
          python scripts/release_gate.py
          python scripts/check_release_lock.py --self-test
      - name: Build versioned source archive and SHA-256 records
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="SkyRelief_Mechanical_Source_Release_${TAG}"
          git archive --format=zip --prefix="SkyRelief_Mechanical_Source_Release/" -o "${NAME}.zip" "${TAG}"
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          cp verification/file_manifest.csv "${NAME}_file_manifest.csv"
          cat "${NAME}.zip.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="SkyRelief_Mechanical_Source_Release_${TAG}"
          gh release create "${TAG}" "${NAME}.zip" "${NAME}.zip.sha256" "${NAME}_file_manifest.csv" \
            --title "SkyRelief ${TAG}" --notes-file RELEASE_NOTES.md --verify-tag
