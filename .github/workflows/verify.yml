name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  files-and-rights:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: File, link, hash and BOM checks
        run: python scripts/validate_repository.py
      - name: Rights gate (tree and Git history, approved licence matrix)
        run: python scripts/release_gate.py
      - name: REUSE licence compliance
        run: pip install reuse==6.2.0 && reuse lint
      - name: Release lock and negative tests
        run: python scripts/check_release_lock.py --self-test
  r01-geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-cad.txt
      - name: Regenerate R01 and require byte-identical exports
        run: |
          python cad/independently_authored/build_reference.py
          git diff --exit-code -- cad/independently_authored
      - name: Independent STEP audit
        run: |
          python scripts/independent_step_audit.py
          git diff --exit-code -- verification/independent_step_audit.json
