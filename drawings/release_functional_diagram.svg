<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<rect width="1000" height="650" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17252f}.h{font-size:22px;font-weight:bold}.s{font-size:14px}.b{font-size:17px;font-weight:bold}</style>
<text x="35" y="45" class="h">Historical payload release / functional sequence</text>
<text x="35" y="75" class="s">SOURCE-DERIVED from prose; no historical stroke, load or servo supply invented</text>
<rect x="45" y="125" width="260" height="90" fill="#f3f6f8" stroke="#344350"/>
<text x="57" y="153" class="b">1 / RETAIN</text>
<text x="57" y="177" class="s">Payload mechanically constrained</text>
<rect x="370" y="125" width="260" height="90" fill="#f3f6f8" stroke="#344350"/>
<text x="382" y="153" class="b">2 / SERVO ACTUATION</text>
<text x="382" y="177" class="s">Command boundary unresolved</text>
<rect x="695" y="125" width="260" height="90" fill="#f3f6f8" stroke="#344350"/>
<text x="707" y="153" class="b">3 / WITHDRAW MEMBER</text>
<text x="707" y="177" class="s">Retaining member frees payload</text>
<rect x="45" y="280" width="260" height="90" fill="#f3f6f8" stroke="#344350"/>
<text x="57" y="308" class="b">4 / SEPARATION</text>
<text x="57" y="332" class="s">Payload moves clear under</text>
<text x="57" y="350" class="s">gravity</text>
<text x="35" y="465" class="s">SEQUENCE: RETAIN -&gt; SERVO ACTUATION -&gt; RETAINING-MEMBER WITHDRAWAL -&gt; PAYLOAD SEPARATION.</text>
<text x="35" y="484" class="s">Axes: +Z upward; gravity toward -Z. Historical mechanism stroke axis unrecorded.</text>
<text x="35" y="503" class="s">D05 fixed support, photographed assembly and independent R01 gate remain distinct.</text>
<defs><marker id="flowarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#344350"/></marker></defs><path d="M307 170H367" stroke="#344350" fill="none" stroke-width="1.3" marker-end="url(#flowarrow)"/><path d="M632 170H692" stroke="#344350" fill="none" stroke-width="1.3" marker-end="url(#flowarrow)"/><path d="M825 217V250H175V278" stroke="#344350" fill="none" stroke-width="1.3" marker-end="url(#flowarrow)"/><text x="35" y="620" font-family="Arial,sans-serif" font-size="12">Arrows = functional roles, never physical wiring; dashed = unresolved implementation.</text></svg>
